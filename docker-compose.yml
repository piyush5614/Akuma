services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairfarm
      POSTGRES_USER: fairfarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairfarm-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairfarm -d fairfarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_PATH: /data/fairfarm.db
      JWT_SECRET: ${JWT_SECRET:-replace-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      WEB_ORIGIN: http://localhost:5173
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      FAIRFARM_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_data:
